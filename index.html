<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa 2026</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>BOLÃO COPA 2026</h1>

        <nav>
            <button onclick="showSection('home')">Início</button>
            <button onclick="showSection('grupos')">Grupos</button>
            <button onclick="showSection('partidas')">Partidas</button>
            <button onclick="showSection('palpites')">Palpites</button>
            <button onclick="showSection('ranking')">Ranking</button>
        </nav>
    </header>

    <main>

        <!-- HOME -->
        <section id="home" class="page active">

            <h2>Jogos do Dia</h2>

            <div id="jogosHoje"></div>

            <h2>Ao Vivo</h2>

            <div id="aoVivo"></div>

        </section>

        <!-- GRUPOS -->
        <section id="grupos" class="page">

            <h2>Grupos</h2>

            <div id="gruposContainer"></div>

        </section>

        <!-- PARTIDAS -->
        <section id="partidas" class="page">

            <h2>Todas as Partidas</h2>

            <input
                type="text"
                id="filtroSelecao"
                placeholder="Filtrar por seleção">

            <button onclick="filtrarPartidas()">
                Buscar
            </button>

            <div id="listaPartidas"></div>

        </section>

        <!-- PALPITES -->
        <section id="palpites" class="page">

            <h2>Meus Palpites</h2>

            <div id="palpitesContainer"></div>

        </section>

        <!-- RANKING -->
        <section id="ranking" class="page">

            <h2>Ranking Global</h2>

            <div id="rankingContainer"></div>

        </section>

    </main>

    <script src="js/mockData.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
